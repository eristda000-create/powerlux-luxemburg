name: CENTRAL Obsidian Connect Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/central_obsidian_connect.ps1'
      - 'scripts/start-central-workshop.ps1'
      - 'scripts/test-central-obsidian-connect.ps1'
      - '.github/workflows/central-obsidian-connect-gate.yml'
  workflow_dispatch:

jobs:
  obsidian-connect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            'scripts/central_obsidian_connect.ps1',
            'scripts/start-central-workshop.ps1',
            'scripts/test-central-obsidian-connect.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "${file}: $($errors | Out-String)" }
          }
      - name: Safety contract
        shell: pwsh
        run: |
          $text = Get-Content 'scripts/central_obsidian_connect.ps1' -Raw
          foreach ($required in @('.obsidian','multiple_candidates','OBSIDIAN_VAULT','User','NoPersist')) {
            if (-not $text.Contains($required)) { throw "Missing safety marker: $required" }
          }
          foreach ($forbidden in @('Remove-Item -Recurse','git reset','git push --force','Invoke-Expression')) {
            if ($text.Contains($forbidden)) { throw "Forbidden behavior present: $forbidden" }
          }
      - name: Discovery behavior tests
        shell: pwsh
        run: ./scripts/test-central-obsidian-connect.ps1
