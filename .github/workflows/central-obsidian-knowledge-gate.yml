name: CENTRAL Obsidian Knowledge Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'knowledge/**'
      - 'scripts/central_obsidian_mount.ps1'
      - 'scripts/central_obsidian_rag.ps1'
      - 'scripts/central_embedding_bootstrap.ps1'
      - 'scripts/central_local_agent_team.ps1'
      - 'scripts/central_local_agent_team_core.ps1'
      - 'scripts/central_safe_repo_update.ps1'
      - 'scripts/start-central-workshop.ps1'
      - 'scripts/test-central-obsidian-knowledge.ps1'
      - 'supabase/migrations/*obsidian*.sql'
      - 'supabase/migrations/*rag*.sql'
      - '.github/workflows/central-obsidian-knowledge-gate.yml'
  workflow_dispatch:

jobs:
  knowledge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $files = @(
            'scripts/central_obsidian_mount.ps1',
            'scripts/central_obsidian_rag.ps1',
            'scripts/central_embedding_bootstrap.ps1',
            'scripts/central_local_agent_team.ps1',
            'scripts/central_local_agent_team_core.ps1',
            'scripts/central_safe_repo_update.ps1',
            'scripts/start-central-workshop.ps1',
            'scripts/test-central-obsidian-knowledge.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "${file}: $($errors | Out-String)" }
          }
      - name: Test runtime-aware safe update policy
        shell: pwsh
        run: |
          . ./scripts/central_safe_repo_update.ps1
          if (Test-CentralRuntimeImpactingPath 'knowledge/PROJECTS/POWERTV/STATE.md') { throw 'Knowledge-only change must not require runtime restart.' }
          if (Test-CentralRuntimeImpactingPath 'supabase/migrations/20260911_example.sql') { throw 'Migration-only change must not require runtime restart.' }
          if (-not (Test-CentralRuntimeImpactingPath 'scripts/central_workshop_bridge.ps1')) { throw 'Bridge change must require runtime restart.' }
          if (-not (Test-CentralRuntimeImpactingPath 'scripts/central_obsidian_rag.ps1')) { throw 'RAG runtime change must require runtime restart.' }
      - name: Verify RAG wrapper invariants
        shell: pwsh
        run: |
          $wrapper = Get-Content -LiteralPath 'scripts/central_local_agent_team.ps1' -Raw
          foreach ($needle in @('central_local_agent_team_core.ps1','central_obsidian_rag.ps1','Get-CentralObsidianRagContext','error_fallback','knowledge_rag')) {
            if ($wrapper -notmatch [regex]::Escape($needle)) { throw "RAG wrapper missing invariant: $needle" }
          }
      - name: Test safe Obsidian knowledge mount
        shell: pwsh
        run: ./scripts/test-central-obsidian-knowledge.ps1
      - name: Verify canonical knowledge pages
        shell: pwsh
        run: |
          $required = @(
            'knowledge/00_HOME.md',
            'knowledge/AI_INSTRUCTIONS.md',
            'knowledge/OPERATING_MODEL.md',
            'knowledge/SYSTEM/AI_STACK.md',
            'knowledge/PROMPTS/FABRIC_CURATED.md',
            'knowledge/PROJECTS/CENTRAL/STATE.md',
            'knowledge/PROJECTS/POWERLUX/STATE.md',
            'knowledge/PROJECTS/POWERTV/STATE.md',
            'knowledge/PROJECTS/VENDETTA/STATE.md',
            'knowledge/PROJECTS/MERG/STATE.md',
            'knowledge/PROJECTS/COGNI/STATE.md'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing $file" }
            $text = Get-Content -LiteralPath $file -Raw
            if ($text -notmatch 'Value' -and $file -like '*STATE.md') { throw "State page lacks value framing: $file" }
          }
          $policy = Get-Content -LiteralPath 'knowledge/OPERATING_MODEL.md' -Raw
          foreach ($needle in @('Fact base','Decision / recommendation','Next actions','KPI / value realization','Evidence ledger')) {
            if ($policy -notmatch [regex]::Escape($needle)) { throw "Knowledge policy missing: $needle" }
          }
