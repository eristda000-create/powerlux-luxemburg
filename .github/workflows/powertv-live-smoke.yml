name: PowerTV Live External Smoke

on:
  push:
    branches:
      - chore/powertv-live-smoke
    paths:
      - '.github/workflows/powertv-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://powertv-evw-live.vercel.app
      CDN: https://cdn.jsdelivr.net/gh/eristda000-create/powerlux-luxemburg@b6dcd9b591e19771b8193d7a5b74de04e8002523/powertv
    steps:
      - name: Wait for repaired production route
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /tmp/evw -w '%{http_code}' --max-time 20 "$BASE/east-vs-west/" || true)
            if [ "$code" = "200" ] && grep -q '/#evw-growth-hub' /tmp/evw && grep -q 'location.replace' /tmp/evw; then
              ok=1
              echo "Integrated EVW route ready on attempt $attempt"
              break
            fi
            echo "attempt=$attempt http=$code"
            sleep 5
          done
          test "$ok" = "1"

      - name: Verify homepage is still authentic PowerTV
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS --max-time 20 "$BASE/" -o /tmp/home
          grep -q 'https://powertv-evw-live.vercel.app/' /tmp/home
          grep -q 'index-qo0EwjoB.js' /tmp/home
          grep -q 'evw-growth.js' /tmp/home
          grep -q 'East vs West 26' /tmp/home
          curl -LfsS --max-time 30 "$CDN/assets/index-qo0EwjoB.js" -o /tmp/app.js
          grep -q 'PowerLux Associates' /tmp/app.js

      - name: Verify SEO no longer promotes standalone EVW page
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS --max-time 20 "$BASE/robots.txt" -o /tmp/robots
          curl -LfsS --max-time 20 "$BASE/sitemap.xml" -o /tmp/sitemap
          grep -q 'Sitemap: https://powertv-evw-live.vercel.app/sitemap.xml' /tmp/robots
          grep -q '<loc>https://powertv-evw-live.vercel.app/</loc>' /tmp/sitemap
          if grep -q 'east-vs-west' /tmp/sitemap; then
            echo 'Standalone EVW page is still in sitemap' >&2
            exit 1
          fi
          echo 'POWERTV_INTEGRATED_EVW_SMOKE=PASS'
