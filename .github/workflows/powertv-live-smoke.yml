name: PowerTV Live External Smoke

on:
  push:
    branches:
      - chore/powertv-live-smoke
    paths:
      - '.github/workflows/powertv-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://powertv-evw-live.vercel.app
      AUTHENTIC_CDN: https://cdn.jsdelivr.net/gh/eristda000-create/powerlux-luxemburg@8ca1846d78ea697c17b5f9d5f04ef13085c7a288/powertv
    steps:
      - name: Wait for dense production release
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 36); do
            code=$(curl -L -sS -o /tmp/js -w '%{http_code}' --max-time 20 "$BASE/ptv-executive.js?probe=$attempt" || true)
            if [ "$code" = "200" ] && grep -q 'Watch now' /tmp/js && grep -q 'EVW Live' /tmp/js && ! grep -q 'What matters now' /tmp/js; then
              ok=1
              echo "Dense release ready on attempt $attempt"
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Verify production transport
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS --max-time 20 "$BASE/" -o /tmp/home
          curl -LfsS --max-time 20 "$BASE/ptv-executive.css" -o /tmp/css
          curl -LfsS --max-time 30 "$AUTHENTIC_CDN/assets/index-qo0EwjoB.js" -o /tmp/app.js
          grep -q 'powertv-authentic-runtime' /tmp/home
          grep -q '#ptv-command-center' /tmp/css
          grep -q 'PowerLux Associates' /tmp/app.js

      - name: Install browser
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify dense rendered mobile UI
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}, deviceScaleFactor:1});
            await page.goto(process.env.BASE + '/?render_probe=dense', {waitUntil:'domcontentloaded', timeout:60000});
            await page.waitForSelector('#ptv-command-center', {state:'visible', timeout:45000});
            await page.waitForTimeout(2500);

            const command = page.locator('#ptv-command-center');
            const text = await command.innerText();
            if (!text.includes('EAST vs WEST 26')) throw new Error('Compact EVW title missing');
            if (!text.includes('Watch now')) throw new Error('Compact live rail missing');
            if (text.includes('What matters now') || text.includes('Discovery before clutter')) throw new Error('Old verbose briefing still visible');
            if (await command.locator('.ptv-button').count() !== 2) throw new Error('Hero must have exactly two primary actions');
            if (await command.locator('.ptv-card').count() !== 4) throw new Error('Live rail must have four compact routes');
            if (await page.locator('.evw-sticky-link:visible').count()) throw new Error('Old floating EVW button visible');

            const commandBox = await command.boundingBox();
            const replay = page.getByText('Sportvideos & Wettkämpfe', {exact:true}).first();
            if (await replay.count()) {
              const replayBox = await replay.boundingBox();
              if (commandBox && replayBox && commandBox.y >= replayBox.y) throw new Error('Replay appears before event layer');
            }
            if (!await page.getByText('MY PLX', {exact:true}).count()) throw new Error('MY PLX missing');
            if (!await page.getByText('PowerLux Associates', {exact:true}).count()) throw new Error('Associates missing');

            const sectionHeight = commandBox ? commandBox.height : 0;
            if (sectionHeight > 1450) throw new Error(`Event layer still too tall on mobile: ${sectionHeight}`);
            console.log('POWERTV_DENSE_MOBILE_SMOKE=PASS height=' + sectionHeight);
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Complete
        run: echo 'POWERTV_DENSE_RELEASE=PASS'
