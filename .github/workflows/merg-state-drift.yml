name: MERG State Drift Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'merg_os/**'
      - 'powerlux_os/CURRENT_STATE.md'
      - 'scripts/merg_state_drift.py'
      - '.github/workflows/merg-state-drift.yml'

permissions:
  contents: read
  issues: write

jobs:
  drift-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout canonical control repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run production/state drift checks
        id: drift
        continue-on-error: true
        env:
          MERG_GITHUB_TOKEN: ${{ secrets.MERG_GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python scripts/merg_state_drift.py

      - name: Upload drift evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merg-state-drift-report
          path: |
            state_drift_report.md
            state_drift_report.json
          retention-days: 14

      - name: Open or update actionable drift issue
        if: steps.drift.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ISSUE="$(gh issue list --state open --search 'MERG State Drift Alert in:title' --json number --jq '.[0].number // empty')"
          if [ -z "$ISSUE" ]; then
            gh issue create \
              --title 'MERG State Drift Alert' \
              --body-file state_drift_report.md
          else
            gh issue comment "$ISSUE" --body-file state_drift_report.md
          fi

      - name: Close resolved drift issue
        if: steps.drift.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ISSUE="$(gh issue list --state open --search 'MERG State Drift Alert in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body 'Latest MERG drift check passed all critical gates. Closing the active drift alert. Unverified optional external checks remain visible in the workflow artifact and are not treated as healthy.'
            gh issue close "$ISSUE" --reason completed
          fi

      - name: Fail workflow on critical production drift
        if: steps.drift.outcome == 'failure'
        run: |
          echo 'Critical MERG production/state drift detected. See state_drift_report.md and the MERG State Drift Alert issue.'
          exit 1
